<svg id="monogramSvg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberBrandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- High-Impact Large SK Monogram -->
  <text
    x="50%"
    y="52%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Inter', 'Poppins', system-ui, sans-serif"
    font-weight="700"
    font-size="76"
    letter-spacing="-3"
    fill="url(#cyberBrandGradient)"
    filter="url(#glowEffect)"
  >
    SK
  </text>
</svg>